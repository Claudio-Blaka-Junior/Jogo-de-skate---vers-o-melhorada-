<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skate 3D</title>

  <style>
    /* Tela cheia, sem barras de rolagem */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1033; }
    canvas { display: block; }

    /* Tela inicial: o clique do jogador libera o áudio do navegador */
    #inicio {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: rgba(27, 16, 51, 0.88);
      color: #fff; font-family: system-ui, "Segoe UI", sans-serif;
      cursor: pointer; user-select: none; text-align: center;
    }
    #inicio h1 { margin: 0; font-size: clamp(2rem, 7vw, 4rem); letter-spacing: 0.02em; }
    #inicio p  { margin: 0; font-size: 1.1rem; opacity: 0.85; }
    #inicio .botao {
      margin-top: 8px; padding: 14px 32px; border-radius: 999px;
      background: #ff3d7f; font-weight: 700; font-size: 1.2rem;
    }
    #inicio:focus-visible .botao { outline: 3px solid #fff; outline-offset: 3px; }

    /* Ajuda de controles e avisos (canto da tela) */
    #hud {
      position: fixed; left: 12px; bottom: 12px; z-index: 5;
      color: #fff; font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
      background: rgba(27, 16, 51, 0.6); padding: 8px 12px; border-radius: 8px;
      pointer-events: none;
    }
    #aviso { color: #ffd166; margin-top: 4px; }
    /* Pontuação, combo e mensagens de manobra */
    #placar, #combo, #msg { position: fixed; z-index: 5; pointer-events: none; font-family: system-ui, "Segoe UI", sans-serif; text-shadow: 0 2px 8px rgba(0,0,0,.55); }
    #placar { top: 12px; left: 16px; color: #fff; font-weight: 800; font-size: clamp(1.8rem, 4vw, 2.8rem); }
    #placar small { font-size: 1rem; font-weight: 600; margin-left: 8px; opacity: .8; }
    #combo { top: 70px; left: 16px; color: #ffd166; font-weight: 700; font-size: 1.5rem; }
    #msg { top: 22%; left: 50%; transform: translateX(-50%); color: #ff3d7f; text-align: center; font-weight: 800; font-size: clamp(1.5rem, 5vw, 2.8rem); }
  </style>

  <!-- Importmap: define de onde vêm "three" e os addons, com versão FIXA (0.160.0) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Tela "Clique para começar" -->
  <div id="inicio" tabindex="0" role="button" aria-label="Clique para começar">
    <h1>Skate 3D</h1>
    <p>W/S acelera e freia &middot; A/D vira e gira no ar &middot; Espaço pula &middot; J, K, L fazem manobras</p>
    <div class="botao">Clique para começar</div>
  </div>

  <!-- Pontuação, combo e mensagens -->
  <div id="placar"><span id="total">0</span><small>pontos</small></div>
  <div id="combo"></div>
  <div id="msg"></div>

  <!-- Ajuda de controles e mensagens sobre arquivos ausentes -->
  <div id="hud">
    W/S: acelerar e frear &middot; A/D: virar (no ar: girar) &middot; Espaço: pular &middot; J: kickflip &middot; K: heelflip &middot; L: shove-it
    <div id="aviso"></div>
  </div>

  <!-- Script principal (módulo ES) -->
  <script type="module" src="game.js"></script>
</body>
</html>
